# FYI Studio Model Policy (ADR-0007) — single source of truth for model + capability metadata.
#
# This file is loaded into the Model Registry / Capability Registry.
# - capabilities: the Capability Registry (what ModelGate v2 can route by)
# - models: the Model Registry (provider, version, pricing, context window, supported capabilities)
# - defaults: recommended default model per worker capability (user may override, capability-gated)

capabilities:
  reasoning:
    description: "Complex multi-step reasoning and analysis"
  vision:
    description: "Image understanding and multimodal input"
  image:
    description: "Image generation"
  speech:
    description: "Speech synthesis (text-to-speech)"
  transcription:
    description: "Speech-to-text / transcription (ASR)"
  embedding:
    description: "Text embedding generation"
  video:
    description: "Video generation / understanding"
  tool_calling:
    description: "Function/tool calling support"
  search:
    description: "Web search / grounded retrieval"
  structured_output:
    description: "Structured/JSON output"

models:
  - provider: openai
    model: gpt-4o
    version: "2024-11-20"
    pricing_per_1k_tokens: 0.005
    context_window: 128000
    capabilities: [reasoning, vision, tool_calling, structured_output]
  - provider: openai
    model: gpt-4o-mini
    version: "2024-07-18"
    pricing_per_1k_tokens: 0.0015
    context_window: 128000
    capabilities: [reasoning, tool_calling, structured_output]
  - provider: anthropic
    model: claude-3-5-sonnet
    version: "20241022"
    pricing_per_1k_tokens: 0.003
    context_window: 200000
    capabilities: [reasoning, vision, tool_calling, structured_output]
  - provider: anthropic
    model: claude-3-haiku
    version: "20240307"
    pricing_per_1k_tokens: 0.00025
    context_window: 200000
    capabilities: [reasoning, tool_calling, structured_output]
  - provider: gemini
    model: gemini-2.5-pro
    version: "2025-01"
    pricing_per_1k_tokens: 0.00125
    context_window: 1000000
    capabilities: [reasoning, vision, tool_calling, structured_output, search]
  - provider: gemini
    model: gemini-2.5-flash
    version: "2025-01"
    pricing_per_1k_tokens: 0.0003
    context_window: 1000000
    capabilities: [reasoning, vision, tool_calling, structured_output, search]
  - provider: openrouter
    model: openrouter/auto
    version: "latest"
    pricing_per_1k_tokens: 0.0
    context_window: 128000
    capabilities: [reasoning, vision, tool_calling, structured_output]
  - provider: groq
    model: llama-3.3-70b-versatile
    version: "latest"
    pricing_per_1k_tokens: 0.00059
    context_window: 128000
    capabilities: [reasoning, tool_calling, structured_output]
  - provider: ollama
    model: llama3.1
    version: "latest"
    pricing_per_1k_tokens: 0.0
    context_window: 128000
    capabilities: [reasoning, tool_calling, structured_output]
  - provider: ollama
    model: llama3.2
    version: "latest"
    pricing_per_1k_tokens: 0.0
    context_window: 128000
    capabilities: [reasoning, structured_output]
  - provider: ollama
    model: llama3.2:1b
    version: "latest"
    pricing_per_1k_tokens: 0.0
    context_window: 131072
    capabilities: [reasoning, structured_output]
  - provider: ollama
    model: deepseek-v4-flash
    version: "0731"
    pricing_per_1k_tokens: 0.0
    context_window: 128000
    capabilities: [reasoning, structured_output]
  - provider: ollama
    model: qwen2.5
    version: "latest"
    pricing_per_1k_tokens: 0.0
    context_window: 32768
    capabilities: [reasoning, structured_output]
  # --- Media models (TTS / ASR / video) ---
  # These are real AI models for the media workers. They are registered so the
  # user can assign an AI model to Voice/Subtitle/Video workers. The actual
  # provider call happens in the media worker (offline engines espeak-ng /
  # ffmpeg remain the default when no AI model is assigned).
  - provider: openai
    model: tts-1
    version: "latest"
    pricing_per_1k_tokens: 0.015
    context_window: 0
    capabilities: [speech]
  - provider: openai
    model: whisper-1
    version: "latest"
    pricing_per_1k_tokens: 0.006
    context_window: 0
    capabilities: [transcription]
  - provider: gemini
    model: gemini-2.5-flash
    version: "2025-01"
    pricing_per_1k_tokens: 0.0003
    context_window: 1000000
    capabilities: [reasoning, vision, tool_calling, structured_output, search, transcription]
  - provider: gemini
    model: veo-3
    version: "latest"
    pricing_per_1k_tokens: 0.0
    context_window: 0
    capabilities: [video]
  - provider: openai
    model: sora
    version: "latest"
    pricing_per_1k_tokens: 0.0
    context_window: 0
    capabilities: [video]
  # Kokoro-82M TTS via Replicate (cloud, ~$0.0023/run). Natural voice, no
  # local model, no OpenAI/Gemini key — only a Replicate API token.
  - provider: replicate
    model: kokoro-82m
    version: "latest"
    pricing_per_1k_tokens: 0.0
    context_window: 0
    capabilities: [speech]

# Default recommended model per worker capability (user may override, capability-gated).
# Ollama Cloud (https://ollama.com/v1) is the working provider — set as default.
defaults:
  content:brief:        # Planner Worker (Phase 2.2) — Content Initiative -> Content Brief
    provider: ollama
    model: deepseek-v4-flash
  research:real:        # Research Worker (real AI)
    provider: ollama
    model: deepseek-v4-flash
  text-synthesis:script:real: # Script Worker (real AI)
    provider: ollama
    model: deepseek-v4-flash
  text-synthesis:script:  # Script Worker (mock)
    provider: mock
    model: mock-script-model
  voice:tts:             # Voice Worker — natural voice via Replicate Kokoro-82M
    provider: replicate
    model: kokoro-82m

# Maps a worker capability (e.g. research:real) to the model capabilities it requires.
# ModelGate v2 uses this to find connected + capable models when the default provider
# is not connected or the user overrides.
worker_capabilities:
  content:brief: [reasoning, structured_output]
  research:real: [reasoning, structured_output]
  text-synthesis:script:real: [reasoning, structured_output]
  voice:tts: [speech]
  subtitle:generate: [transcription]
  video:compose: [video]
